---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-sc
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-pv-sc
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-sc          
  hostPath:
    path: /tmp/k8s-local-data-sc      
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sc-pvc
spec:
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
  storageClassName: local-sc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-sc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-sc
  template:
    metadata:
      labels:
        app: data-exchange-sc
    spec:
      containers:
      - name: writer
        image: busybox
        command: ["/bin/sh", "-c"]
        args: ["while true; do echo $(date) >> /mnt/data/shared.txt; sleep 5; done"]
        volumeMounts:
        - name: sc-data
          mountPath: /mnt/data
      - name: reader
        image: busybox
        command: ["/bin/sh", "-c"]
        args: ["tail -f /mnt/data/shared.txt"]
        volumeMounts:
        - name: sc-data
          mountPath: /mnt/data
      volumes:
      - name: sc-data
        persistentVolumeClaim:
          claimName: sc-pvc