apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-wait-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-wait-svc
  template:
    metadata:
      labels:
        app: nginx-wait-svc
    spec:
      initContainers:
      - name: wait-for-service
        image: busybox:1.36
        command: ['sh', '-c', 'until nslookup nginx-svc; do echo waiting for service; sleep 2; done']
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80